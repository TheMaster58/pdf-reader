[package]
name = "pdf-reader"
version = "0.2.0"
description = "A simple PDF reader with highlights and notes"
edition = "2021"

[lib]
name = "pdf_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller binary: link-time optimisation, one codegen unit, strip symbols, abort on panic.
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
