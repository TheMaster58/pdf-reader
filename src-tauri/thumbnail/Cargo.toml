[package]
name = "pdf-reader-thumbnail"
version = "0.1.0"
description = "Windows Explorer thumbnail provider that shows the first page of a PDF"
edition = "2021"
publish = false

[lib]
name = "pdf_reader_thumbnail"
# cdylib: the COM DLL Explorer loads. rlib: lets the unit tests call the renderer directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The #[implement] macro expands to paths in windows-core, so it must be a direct dependency.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Data_Pdf",
  "Foundation",
  "Graphics_Imaging",
  "Storage_Streams",
  "UI",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
]

# Built on its own (the main app's build script runs cargo here), so it is its own workspace root.
[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
